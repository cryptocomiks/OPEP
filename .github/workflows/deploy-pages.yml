name: Deploy Sneakerie to Pages

on:
  push:
    branches: [claude/shoe-closet-app-4xsgtc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the app (armoire/ only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./armoire

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
