name: Deploy Sneakerie to Pages

on:
  push:
    branches: [main, claude/shoe-closet-app-4xsgtc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # ⏸️ SNEAKIII EN PAUSE : on publie le dashboard OPEP à la racine et une
      # page « en pause » à /armoire/ (l'app n'est PAS publiée). La source de
      # l'app reste dans armoire/ ; pour reprendre, republier armoire/index.html.
      - name: Build publish dir (OPEP live · SNEAKIII paused)
        run: |
          rm -rf _site && mkdir -p _site/armoire
          cp index.html _site/index.html
          cp .github/paused/index.html _site/armoire/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
